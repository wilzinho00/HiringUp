<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
     <nav
      class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="index.html">
          <h1>Hiring <span class="brand-highlight">UP</span></h1>
        </a>
       <a href="index.html" class="back-link">
       ← Voltar
       </a>
      </div>
    </nav>
  
    <div class="container py-5">
      <div class="auth-container">
        <div class="auth-left">
          <div>
            <h1>Hiring <span class="brand-highlight">UP</span></h1>
            <h2>Bem-vindo de volta!</h2>
            <p>Conecte-se e dê o próximo passo na sua carreira profissional.</p>
          </div>
        </div>
        <div class="auth-right">
          <h1>Faça Login</h1>
          <p class="auth-subtitle">
            Acesse suas vagas, acompanhe candidaturas e gerencie seu perfil.
          </p>
          <form id="login-form">
            <input
              id="login-email"
              type="email"
              class="form-control mb-3"
              placeholder="seu@email.com" />
            <input
              id="login-password"
              type="password"
              class="form-control mb-3"
              placeholder="Senha" />
            <button type="submit" class="btn btn-primary w-100 login-btn">
              Entrar
            </button>
          </form>
          <div id="login-feedback" class="mt-4"></div>
          <div class="register-link">
            Ainda não possui conta? <a href="cadastro.html">Cadastre-se</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      
        <div class="footer-bottom text-center">
          © 2026 Hiring UP - Todos os direitos reservados.
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
