<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nova Vaga - Hiring UP</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="index.html">
          <h1>Hiring <span class="brand-highlight">UP</span></h1>
        </a>
      </div>
    </nav>

    <section class="jobs-section">
      <div class="container">
        <div class="form-card">
          <h2 class="form-title">Cadastrar Nova Vaga</h2>

          <form>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Cargo</label>
                <input type="text" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Empresa</label>
                <input type="text" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Localização</label>
                <input type="text" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Faixa Salarial</label>
                <input type="text" class="form-control" />
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">Modalidade</label>

                <select class="form-control">
                  <option>Remoto</option>
                  <option>Presencial</option>
                  <option>Híbrido</option>
                </select>
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">Descrição da Vaga</label>
                <textarea class="form-control" rows="5"></textarea>
              </div>

              <div class="col-12 mb-4">
                <label class="form-label">Requisitos</label>
                <textarea class="form-control" rows="4"></textarea>
              </div>
            </div>

            <button class="btn cadastro-btn">Publicar Vaga</button>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
