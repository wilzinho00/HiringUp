<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="auth-body">
    <div class="container">
      <div class="auth-container">
        <!-- ESQUERDA -->
        <div class="auth-left">
          <div>
            <h2>Job <span class="brand-highlight">Navigator</span></h2>

            <h2>Crie sua conta gratuitamente!</h2>

            <p>Junte-se a milhares de profissionais e empresas.</p>
            <p>
              "Conectando talentos ao mercado de trabalho e oportunidades de
              estágios para os estudantes."
            </p>
          </div>
        </div>

        <!-- DIREITA -->
        <div class="auth-right">
          <h1>Cadastre-se</h1>

          <form id="register-form">
            <input
              id="register-name"
              type="text"
              class="form-control mb-3"
              placeholder="Nome Completo" />

            <input
              id="register-email"
              type="email"
              class="form-control mb-3"
              placeholder="E-mail Profissional" />

            <div class="row">
              <div class="col-md-6">
                <input
                  id="register-password"
                  type="password"
                  class="form-control mb-3"
                  placeholder="Senha" />
              </div>

              <div class="col-md-6">
                <input
                  id="register-confirm"
                  type="password"
                  class="form-control mb-3"
                  placeholder="Confirmar" />
              </div>
            </div>

            <button type="submit" class="btn cadastro-submit">
              Criar Minha Conta
            </button>
          </form>
          <div id="register-feedback" class="mt-4"></div>

          <div class="register-link">
            Já possui conta?
            <a href="login.html">Fazer login</a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
