<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Currículo | HiringUp</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="index.html">
          <h2 class="fw-bold mb-4">
            Hiring <span class="brand-highlight">UP</span>
          </h2>
        </a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="vagas.html">Vagas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="cadastrocurriculo.html"
                >Crie Um Currículo</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- FORM -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4 shadow-lg border-0">
            <h2 class="fw-bold mb-1">Currículo</h2>
            <p class="text-muted mb-4">
              Envie suas informações e conecte-se com as oportunidades.
            </p>

            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome completo</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Digite seu nome"
                    required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Digite seu e-mail"
                    required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Telefone</label>
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="(11) 99999-9999"
                    required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Área de interesse</label>

                  <select class="form-select">
                    <option selected disabled>Selecione uma área</option>

                    <option class="fw-bold text-primary">⭐ Estagiário</option>

                    <option>Desenvolvimento Web</option>
                    <option>Desenvolvedor Front-End</option>
                    <option>Desenvolvedor Back-End</option>
                    <option>Full Stack</option>
                    <option>Design Gráfico</option>
                    <option>UI/UX Design</option>
                    <option>Marketing Digital</option>
                    <option>Social Media</option>
                    <option>Suporte Técnico</option>
                    <option>Analista de Sistemas</option>
                    <option>Administrador</option>
                    <option>Recursos Humanos</option>
                    <option>Financeiro</option>
                    <option>Atendimento ao Cliente</option>
                    <option>Vendas</option>
                    <option>Logística</option>
                    <option>Engenharia de Software</option>
                    <option>Banco de Dados</option>
                    <option>Cyber Segurança</option>
                    <option>QA / Testes</option>
                    <option>DevOps</option>
                    <option>Data Science</option>
                    <option>Outras Opções</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Resumo profissional</label>
                  <textarea
                    class="form-control"
                    rows="5"
                    placeholder="Descreva sua experiência..."></textarea>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Upload do currículo</label>
                  <input type="file" class="form-control" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Empresa desejada</label>
                  <select class="form-select">
                    <option>Google Brasil</option>
                    <option>Spotify</option>
                    <option>Mercado Livre</option>
                  </select>
                </div>

                <div class="col-12 mt-3">
                  <button class="btn btn-primary w-100 py-2">
                    Enviar Currículo
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
