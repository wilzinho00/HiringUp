<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Empresa | HiringUp</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="index.html">
          <h2 class="fw-bold mb-4">
            Hiring <span class="brand-highlight">UP</span>
          </h2>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="empresas.html">Empresas</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="cadastroempresas.html"
                >Anuncie Uma Vaga</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h1 class="fw-bold">Cadastre sua Empresa</h1>

          <p class="text-muted">
            Divulgue vagas e encontre profissionais qualificados.
          </p>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-lg border-0 p-4">
              <form id="empresa-form">
                <div id="empresa-feedback" class="mb-4"></div>
                <div class="row g-4">
                  <!-- EMPRESA -->
                  <div class="col-md-6">
                    <label class="form-label"> Nome da Empresa </label>

                    <input
                      id="empresa-nome"
                      type="text"
                      class="form-control"
                      placeholder="Digite o nome da empresa"
                      required />
                  </div>

                  <!-- EMAIL -->
                  <div class="col-md-6">
                    <label class="form-label"> E-mail Corporativo </label>

                    <input
                      id="empresa-email"
                      type="email"
                      class="form-control"
                      placeholder="empresa@email.com"
                      required />
                  </div>

                  <!-- SITE -->
                  <div class="col-md-6">
                    <label class="form-label"> Site Oficial </label>

                    <input
                      id="empresa-site"
                      type="url"
                      class="form-control"
                      placeholder="https://empresa.com" />
                  </div>

                  <!-- TELEFONE -->
                  <div class="col-md-6">
                    <label class="form-label"> Telefone </label>

                    <input
                      type="tel"
                      class="form-control"
                      placeholder="(11) 99999-9999" />
                  </div>

                  <!-- ÁREA -->
                  <div class="col-md-6">
                    <label class="form-label"> Área de Atuação </label>

                    <select class="form-select">
                      <option>Tecnologia</option>
                      <option>Marketing</option>
                      <option>Financeiro</option>
                      <option>RH</option>
                      <option>Suporte Técnico</option>
                      <option>Produção</option>
                      <option>Vendas</option>
                      <option>Motorista</option>
                      <option>Saúde</option>
                      <option>Segurança</option>
                      <option>Mecânica</option>
                      <option>Elétrica</option>
                      <option>Construção Civil</option>
                      <option>Educacional</option>
                      <option>Alimentação</option>
                      <option>Orgão Público</option>
                      <option>Outras Opções</option>
                    </select>
                  </div>

                  <!-- LOGO -->
                  <div class="col-md-6">
                    <label class="form-label"> Logo da Empresa </label>

                    <input type="file" class="form-control" />
                  </div>

                  <!-- DESCRIÇÃO -->
                  <div class="col-12">
                    <label class="form-label"> Sobre a Empresa </label>

                    <textarea
                      class="form-control"
                      rows="5"
                      placeholder="Fale sobre sua empresa..."></textarea>
                  </div>

                  <!-- VAGA -->
                  <div class="col-md-6">
                    <label class="form-label"> Cargo da Vaga </label>

                    <input
                      type="text"
                      class="form-control"
                      placeholder="Ex: Desenvolvedor Front-End" />
                  </div>

                  <!-- SALÁRIO -->
                  <div class="col-md-6">
                    <label class="form-label"> Faixa Salarial </label>

                    <input
                      type="text"
                      class="form-control"
                      placeholder="R$ 3.000 - R$ 5.000" />
                  </div>

                  <!-- DESCRIÇÃO DA VAGA -->
                  <div class="col-12">
                    <label class="form-label"> Descrição da Vaga </label>

                    <textarea
                      class="form-control"
                      rows="5"
                      placeholder="Descreva os requisitos da vaga..."></textarea>
                  </div>

                  <!-- BOTÃO -->
                  <div class="col-12 mt-3">
                    <button
                      type="submit"
                      class="btn btn-primary w-100 py-3 fw-bold">
                      Publicar Vaga
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
