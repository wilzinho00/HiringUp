<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Currículo | HiringUp</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="index.html">
          <h2 class="fw-bold mb-4">
            Hiring <span class="brand-highlight">UP</span>
          </h2>
        </a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="vagas.html">Vagas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="curriculoup.html"
                >Currículo UP</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CABEÇALHO -->

    <!-- FORMULÁRIO -->
    <section class="jobs-section pb-5">
      <div class="container">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4 p-lg-5">
            <form id="curriculo-form">
              <div id="curriculo-feedback" class="mb-4"></div>

              <!-- DADOS PESSOAIS -->

              <h3 class="mb-4">Dados Pessoais</h3>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome Completo </label>
                  <input
                    id="curriculo-nome"
                    type="text"
                    class="form-control"
                    required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">E-mail </label>
                  <input
                    id="curriculo-email"
                    type="email"
                    class="form-control"
                    required />
                </div>

                <div class="col-md-4">
                  <label class="form-label">Telefone </label>
                  <input
                    id="curriculo-telefone"
                    type="tel"
                    class="form-control"
                    required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">CEP</label>
                  <input type="text" class="form-control" />
                </div>

                <div class="col-md-4">
                  <label class="form-label">Data de Nascimento</label>
                  <input type="date" class="form-control" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Cidade</label>
                  <input type="text" class="form-control" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Estado</label>
                  <input type="text" class="form-control" />
                </div>
              </div>

              <hr class="my-5" />

              <!-- REDES -->

              <h3 class="mb-4">Redes Profissionais</h3>

              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">LinkedIn</label>
                  <input type="url" class="form-control" />
                </div>

                <div class="col-md-4">
                  <label class="form-label">GitHub</label>
                  <input type="url" class="form-control" />
                </div>

                <div class="col-md-4">
                  <label class="form-label">Portfólio</label>
                  <input type="url" class="form-control" />
                </div>
              </div>

              <hr class="my-5" />

              <!-- RESUMO -->

              <h3 class="mb-4">Resumo Profissional</h3>

              <textarea
                class="form-control"
                rows="5"
                placeholder="Conte um pouco sobre sua trajetória profissional..."></textarea>

              <hr class="my-5" />

              <!-- EXPERIÊNCIA -->

              <h3 class="mb-4">Experiência Profissional</h3>

              <div class="row g-3">
                <div class="col-md-6">
                  <input type="text" class="form-control" placeholder="Cargo" />
                </div>

                <div class="col-md-6">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Empresa" />
                </div>

                <div class="col-12">
                  <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Descreva suas atividades"></textarea>
                </div>
              </div>

              <hr class="my-5" />

              <!-- ESCOLARIDADE -->

              <h3 class="mb-4">Escolaridade</h3>

              <div class="row g-3">
                <div class="col-md-6">
                  <input type="text" class="form-control" placeholder="Curso" />
                </div>

                <div class="col-md-6">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Instituição" />
                </div>
              </div>

              <hr class="my-5" />

              <!-- COMPETÊNCIAS -->

              <h3 class="mb-4">Competências</h3>

              <textarea
                class="form-control"
                rows="4"
                placeholder="HTML, CSS, JavaScript, Bootstrap, Python..."></textarea>

              <hr class="my-5" />

              <!-- CERTIFICAÇÕES -->

              <h3 class="mb-4">Certificações e Licenças</h3>

              <textarea
                class="form-control"
                rows="4"
                placeholder="Certificações, cursos e licenças"></textarea>

              <hr class="my-5" />

              <!-- IDIOMAS -->

              <h3 class="mb-4">Idiomas</h3>

              <input
                type="text"
                class="form-control"
                placeholder="Ex: Inglês Avançado, Espanhol Intermediário" />

              <hr class="my-5" />

              <!-- ÁREA -->

              <h3 class="mb-4">Área de Interesse</h3>

              <select class="form-select">
                <option>⭐ Estagiário</option>

                <option>Desenvolvimento Web</option>
                <option>Desenvolvedor Front-End</option>
                <option>Desenvolvedor Back-End</option>
                <option>Full Stack</option>
                <option>Design Gráfico</option>
                <option>UI/UX Design</option>
                <option>Marketing Digital</option>
                <option>Social Media</option>
                <option>Suporte Técnico</option>
                <option>Analista de Sistemas</option>
                <option>Administrador</option>
                <option>Recursos Humanos</option>
                <option>Financeiro</option>
                <option>Atendimento ao Cliente</option>
                <option>Vendas</option>
                <option>Logística</option>
                <option>Engenharia de Software</option>
                <option>Banco de Dados</option>
                <option>Cyber Segurança</option>
                <option>QA / Testes</option>
                <option>DevOps</option>
                <option>Data Science</option>
                <option>Outras Opções</option>
              </select>

              <hr class="my-5" />

              <!-- CURRÍCULO -->

              <h3 class="mb-4">Anexar Currículo</h3>

              <input type="file" class="form-control" />

              <div class="mt-5">
                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Salvar Currículo
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
